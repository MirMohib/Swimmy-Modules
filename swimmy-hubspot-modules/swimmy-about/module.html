
{% macro br_lines(text) %}{% for line in text|split('//') %}{{ line|trim }}{% if not loop.last %}<br>{% endif %}{% endfor %}{% endmacro %}

<section class="sw-about">
  <div class="sw-about__inner">

    <div class="sw-about__top">
      <p class="sw-about__label">{{ module.top_label_left }}</p>
      <p class="sw-about__label sw-about__label--muted">{{ module.top_label_right }}</p>
    </div>

    <div class="sw-about__layout">
      <div class="sw-about__title-col">
        <h2 class="sw-about__title">{{ br_lines(module.heading) }}</h2>
        <p class="sw-about__big">{{ module.big_word }}</p>
      </div>

      <div class="sw-about__prose">
        <div class="sw-about__richtext">{{ module.prose }}</div>
        <a class="sw-link" href="{{ module.link.url.href }}">{{ module.link_text }}</a>
      </div>
    </div>

  </div>
</section>
