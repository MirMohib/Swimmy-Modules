
<section class="sw-more">
  <div class="sw-more__inner">
    <p class="sw-more__label sw-reveal">{{ module.top_label }}</p>
    <h2 class="sw-more__title sw-reveal sw-reveal--delay-1">{{ module.heading }}</h2>
    {% if module.message %}
    <div class="sw-more__text sw-reveal sw-reveal--delay-2">{{ module.message }}</div>
    {% endif %}
    <div class="sw-more__rule sw-reveal sw-reveal--delay-3"></div>
  </div>
</section>
