
<section class="sw-more">
  <div class="sw-more__inner">
    <p class="sw-more__label">{{ module.top_label }}</p>
    <h2 class="sw-more__title">{{ module.heading }}</h2>
    {% if module.message %}
    <div class="sw-more__text">{{ module.message }}</div>
    {% endif %}
    <div class="sw-more__rule"></div>
  </div>
</section>
